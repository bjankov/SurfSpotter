services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: surf_spot_db
      POSTGRES_USER: surfspot
      POSTGRES_PASSWORD: surfspot
    ports:
      - "5432:5432"
    volumes:
      - ./docker/01_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:z
      - ./docker/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:z
      # Persistent volume
      - surf_spot_data:/var/lib/postgresql
volumes:
  surf_spot_data: